name: Continuous OCI Python SDK Provisioner Loop

# НЕ отменять_running-прогон: именно cancel-in-progress: true объясняет
# оборванные scheduled-прогоны на 46–56 минутах (новый запуск убивал охоту
# посреди цикла). С false прогоны выстраиваются в очередь и охота идёт
# почти без пауз.
concurrency:
  group: oci-provisioner-loop
  cancel-in-progress: false

on:
  schedule:
    # Раз в 2 часа. При cancel-in-progress:false очередь даёт почти
    # непрерывную охоту; если репозиторий PRIVATE (лимит 2000 мин/мес на
    # free-тарифе) — поставь '0 */6 * * *' или уменьши HUNT_ATTEMPTS до 25.
    - cron: '0 */2 * * *'
  workflow_dispatch:     # ручной запуск остаётся доступен

jobs:
  attempt-build:
    runs-on: ubuntu-latest
    # С новыми паузами (150 с после capacity, бэк-офф 300–900 с после 429)
    # прогон может жить дольше часа — дефолтный/старый лимит его рвал.
    timeout-minutes: 350
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install SDK Requirements
        run: pip install -r requirements.txt

      - name: Execute Python Provisioning Engine
        env:
          PYTHONUNBUFFERED: "1"
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_PUBLIC_SSH_KEY: ${{ secrets.OCI_PUBLIC_SSH_KEY }}
          # Тюнинг охоты без правок кода (значения = дефолты bot.py):
          HUNT_ATTEMPTS: "60"
          HUNT_SLEEP_CAPACITY: "150"
          HUNT_SLEEP_RATE: "300"
        run: python "Ampere 12 ram 2 cpu/bot.py"
